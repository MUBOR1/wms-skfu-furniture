
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: wms_user
      POSTGRES_PASSWORD: wms_pass_dev
      POSTGRES_DB: wms_db
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - DATABASE_URL=postgresql+psycopg://wms_user:wms_pass_dev@db:5432/wms_db
      - SECRET_KEY=prod_secret_key_change_me
    depends_on: [db]
    ports: ["8000:8000"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on: [backend]
    ports: ["80:80"]

volumes:
  pgdata: